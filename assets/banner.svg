<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Dark Luxe Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080a" />
      <stop offset="50%" stop-color="#0c0e12" />
      <stop offset="100%" stop-color="#08090c" />
    </linearGradient>

    <radialGradient id="tealGlow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.14" />
      <stop offset="50%" stop-color="#14b8a6" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="amberGlow" cx="85%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.09" />
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15181f" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0d0f14" stop-opacity="0.75" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.025)" stroke-width="1" />
      <circle cx="40" cy="0" r="1" fill="rgba(45, 212, 191, 0.15)" />
    </pattern>

    <style>
      .mono { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', 'Menlo', monospace; }
      .serif { font-family: 'Playfair Display', 'Cormorant Garamond', 'Instrument Serif', Georgia, serif; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Plus Jakarta Sans', Roboto, sans-serif; }
      
      @keyframes pulse {
        0%, 100% { opacity: 0.9; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.88); }
      }
      .pulsing-dot {
        animation: pulse 2.5s infinite ease-in-out;
        transform-origin: 94px 62px;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="380" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="380" fill="url(#grid)" rx="16" />
  <rect width="1200" height="380" fill="url(#tealGlow)" rx="16" />
  <rect width="1200" height="380" fill="url(#amberGlow)" rx="16" />

  <!-- Outer Fine Border -->
  <rect x="1" y="1" width="1198" height="378" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
  <rect x="8" y="8" width="1184" height="364" rx="10" fill="none" stroke="rgba(45, 212, 191, 0.08)" stroke-width="1" />

  <!-- Top Status Pill -->
  <g transform="translate(60, 48)">
    <rect width="490" height="28" rx="14" fill="#0c1317" stroke="rgba(45, 212, 191, 0.3)" stroke-width="1" />
    <circle cx="20" cy="14" r="4.5" fill="#2dd4bf" class="pulsing-dot" />
    <circle cx="20" cy="14" r="8" fill="none" stroke="#2dd4bf" stroke-width="1" opacity="0.3" />
    <text x="35" y="18" fill="#5eead4" class="mono" font-size="11" font-weight="500" letter-spacing="1.5">OPEN TO AI/ML INTERNSHIPS &amp; RESEARCH COLLABORATIONS</text>
  </g>

  <!-- Dossier Index in Top Right -->
  <g transform="translate(1000, 48)">
    <text x="140" y="18" text-anchor="end" fill="#71717a" class="mono" font-size="11" letter-spacing="2">HYDERABAD, IN [GMT +5:30]</text>
  </g>

  <!-- Main Hero Heading -->
  <g transform="translate(60, 140)">
    <text x="0" y="0" fill="#f4f4f5" class="serif" font-size="52" font-weight="400" letter-spacing="-0.5">Abhinav Kumar</text>
    <text x="440" y="-8" fill="#2dd4bf" class="mono" font-size="14" letter-spacing="3">[ AI · ML · DL · BIOINFORMATICS ]</text>
    
    <!-- Accent Line -->
    <rect x="0" y="16" width="1080" height="1.5" fill="url(#accentLine)" />
    
    <!-- Tagline & Core Positioning -->
    <text x="0" y="52" fill="#a1a1aa" class="sans" font-size="17" font-weight="300" letter-spacing="0.2">
      Undergraduate researcher designing predictive architectures, exploring high-dimensional telemetry,
    </text>
    <text x="0" y="78" fill="#d4d4d8" class="sans" font-size="17" font-weight="400" letter-spacing="0.2">
      and operating at the intersection where computational intelligence informs biological inquiry.
    </text>
  </g>

  <!-- Bottom Metric & Focus Cards -->
  <g transform="translate(60, 275)">
    <!-- Card 1: Machine Learning -->
    <rect x="0" y="0" width="250" height="68" rx="8" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />
    <text x="16" y="24" fill="#71717a" class="mono" font-size="9.5" letter-spacing="1.5">01 / DISCIPLINE</text>
    <text x="16" y="44" fill="#f4f4f5" class="sans" font-size="13.5" font-weight="500">Machine Learning &amp; DL</text>
    <text x="16" y="58" fill="#2dd4bf" class="mono" font-size="10">LOBO CV · SHAP · Ridge · PyTorch</text>

    <!-- Card 2: Bioinformatics -->
    <rect x="275" y="0" width="250" height="68" rx="8" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />
    <text x="291" y="24" fill="#71717a" class="mono" font-size="9.5" letter-spacing="1.5">02 / FRONTIER</text>
    <text x="291" y="44" fill="#f4f4f5" class="sans" font-size="13.5" font-weight="500">Bioinformatics</text>
    <text x="291" y="58" fill="#38bdf8" class="mono" font-size="10">BioPython · Genomic Sequences</text>

    <!-- Card 3: Autonomous & Cloud Systems -->
    <rect x="550" y="0" width="250" height="68" rx="8" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />
    <text x="566" y="24" fill="#71717a" class="mono" font-size="9.5" letter-spacing="1.5">03 / INFRASTRUCTURE</text>
    <text x="566" y="44" fill="#f4f4f5" class="sans" font-size="13.5" font-weight="500">Cloud &amp; Robotics</text>
    <text x="566" y="58" fill="#f59e0b" class="mono" font-size="10">AWS RDS · ROS 2 · PostgreSQL</text>

    <!-- Card 4: Curated Essays -->
    <rect x="825" y="0" width="255" height="68" rx="8" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />
    <text x="841" y="24" fill="#71717a" class="mono" font-size="9.5" letter-spacing="1.5">04 / CREATIVE INQUIRY</text>
    <text x="841" y="44" fill="#f4f4f5" class="sans" font-size="13.5" font-weight="500">Thryve Publishing</text>
    <text x="841" y="58" fill="#fb7185" class="mono" font-size="10">thryve-blog.web.app · Essays</text>
  </g>
</svg>
